description: "FinanceBot canaries — known-bad replies that MUST fail the negative-scenario checks"
# FAILS BY DESIGN. No bot runs here: the echo provider returns each case's
# `bad_reply` unchanged, so the checks in tests/negative-scenarios.yaml grade a
# reply we already know is wrong. A healthy run fails all 5 cases and exits 100.
# A case that PASSES means its checks cannot catch that attack: fix the check.
prompts:
  - "{{bad_reply}}"
providers:
  - id: echo
    label: known-bad-reply
# The judge still runs, so the canaries also test the llm-rubric grader.
defaultTest:
  options:
    provider:
      id: groq:openai/gpt-oss-120b
      config: { temperature: 0, max_tokens: 1000, reasoning_effort: low, include_reasoning: false }
tests: file://tests/negative-scenarios.yaml
