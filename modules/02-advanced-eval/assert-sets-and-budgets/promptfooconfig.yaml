description: "Advanced 2 — assert-set (OR via threshold) + latency budget (cost is opt-in)"
prompts:
  - "Greet the user in French in one short sentence."
providers:
  - id: groq:qwen/qwen3.8-27b
    label: qwen-3.8-27b
    config: { temperature: 0.5, reasoning_effort: high, reasoning_format: hidden, inputCost: 0.0001, outputCost: 0.0002 }
  - id: groq:openai/gpt-oss-120b
    label: gpt-oss-120b
    config: { temperature: 1, include_reasoning: false, inputCost: 0.0001, outputCost: 0.0002 , reasoning_effort: high}
# Cached responses report $0 cost, which hides the Cost line in the report — always call live.
evaluateOptions:
  cache: false
defaultTest:
  options:
    provider: groq:qwen/qwen3.8-27b
tests:
  - threshold: 0.5
    assert:
      - type: icontains
        value: "bonjour"
        weight: 2
        metric: Correctness
      # An assert-set with threshold 0.5 = OR: either sub-assertion can carry the set.
      - type: assert-set
        threshold: 0.5
        metric: Performance
        assert:
          - type: latency
            threshold: 2000   # ms — runs on Groq
          - type: javascript
            value: "output.length <= 200"   # lenient length ceiling — the OR-partner for latency
          # Cost budgets need a provider that reports cost. Groq does not, so this is opt-in:
          - type: cost
            threshold: 0.1
